name: Plugin regression tests

on:
  pull_request:
  push:
    branches: [main, improve-archive-search]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # ArtFrame uses Image.retainWhileLoading, introduced in Qt 6.8.
      - name: Install Qt test runtime
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Test search and library
        run: |
          node tests/search.test.cjs
          node tests/library.test.cjs
      - name: Test cast protocol and backup reader
        run: python3 -m unittest discover -s tests -v
      - name: Test QML playback and browser interactions
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_PLATFORMTHEME: basic
          QT_QUICK_BACKEND: software
        run: qmltestrunner -input tests/qml -import tests/support
