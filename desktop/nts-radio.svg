<?xml version="1.0" encoding="UTF-8"?>
<!--
  The plugin's station mark as a launcher icon.

  Deliberately not the NTS logo: no NTS artwork or trademark is redistributed
  here. It is the same typographic stand-in the bar widget draws — a hard-edged
  block of ink with the letters knocked out of it — fixed to black and white
  because a launcher icon has no theme to read from.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#000000"/>
  <rect x="16" y="16" width="224" height="224" fill="none" stroke="#ffffff" stroke-width="10"/>
  <text x="128" y="128"
        font-family="DejaVu Sans, Liberation Sans, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="bold" letter-spacing="8"
        fill="#ffffff" text-anchor="middle" dominant-baseline="central">NTS</text>
</svg>
